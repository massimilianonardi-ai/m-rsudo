name: Publish immutable m-rsudo source release
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'res/**'
      - 'build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build actual package sources and verify release archive
        shell: sh
        run: |
          set -eu
          sh -n build.sh
          ! grep -q 'set -o pipefail' lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh
          sh .github/scripts/rsudo-apisix-traditional-test.sh
          sh .github/scripts/rsudo-keycloak-kcadm-test.sh
          sh tests/deploy-entrypoints.sh
          sh build.sh release
          cmp lib/sys/sh/rsudo/rsudo-mod-apisix.lib.sh release/root/lib/sh/rsudo-mod-apisix.lib.sh
          cmp lib/sys/sh/rsudo/rsudo-mod-keycloak.lib.sh release/root/lib/sh/rsudo-mod-keycloak.lib.sh
          test -f release/root/lib/sh/rsudo-mod-apisixlegacy.lib.sh
          test ! -e release/root/lib/sh/rsudo-mod-keycloaklegacy.lib.sh
          cd release
          sha256sum m-rsudo-v0.1.4-all.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf m-rsudo-v0.1.4-all.tar.gz | grep -q '^bin/'
          tar -tzf m-rsudo-v0.1.4-all.tar.gz | grep -q '^lib/sh/'
      - name: Publish immutable v0.1.4 only if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          if gh release view v0.1.4 >/dev/null 2>&1; then
            echo 'v0.1.4 exists, refusing to replace the immutable release'
            exit 0
          fi
          gh release create v0.1.4 release/m-rsudo-v0.1.4-all.tar.gz release/SHA256SUMS \
            --target "$GITHUB_SHA" --title 'm-rsudo v0.1.4' \
            --notes 'Native APISIX rest/key and Keycloak kcadm interfaces; legacy APISIX remains available, legacy Keycloak no longer packaged. Initial rsudo-deploy interface wiring only, not a complete deployment engine. Local synthetic tests and archive checks; real SSH/sudo and API acceptance still require operator testing.'
