name: R1 real v0.1.2 rsudo package installation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/r1-installed-v012-test.sh'
      - '.github/scripts/r1-pty-admin-test.py'
      - '.github/workflows/r1-installed-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: rsudo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/m-os
          ref: 1e3a038a5abf6f8c176272d8e44464c842d3cefd
          path: m-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: pkg-schema-v2
          path: catalog
          persist-credentials: false
      - name: Install coordinated published GitHub releases through public m pkg
        shell: sh
        run: |
          set -eu
          cd m-source
          ./m osarch update
          [ "$(git -C ../catalog rev-parse HEAD)" = 2c0df87a488bfeac6d185336ea5ae5a4ea469c4a ] || exit 9
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          ./m pkg install m-core@v0.1.1 m-term@v0.1.1 m-rsudo@v0.1.2
          ./m sh ../rsudo/.github/scripts/r1-installed-v012-test.sh
