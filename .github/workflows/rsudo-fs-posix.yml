name: Verify POSIX rsudo-fs source packaging
on:
  pull_request:
    paths:
      - 'lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh'
      - 'build.sh'
      - 'res/sys/manual/rsudo-mod-fs.lib.sh'
      - '.github/workflows/rsudo-fs-posix.yml'
  push:
    branches: [main]
    paths:
      - 'lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh'
      - 'build.sh'
      - '.github/workflows/rsudo-fs-posix.yml'
permissions:
  contents: read
jobs:
  source-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the actual original POSIX source and packaged identity
        shell: sh
        run: |
          set -eu
          sh -n lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh
          sh -c '. ./lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh; command -v rsudo_mod_fs_get >/dev/null; command -v rsudo_mod_fs_put >/dev/null'
          if grep -q 'set -o pipefail' lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh; then
            echo 'Unexpected pipefail dependency in rsudo-fs source' >&2
            exit 1
          fi
          sh -n build.sh
          sh build.sh release
          test -f release/m-rsudo-v0.1.5-all.tar.gz
          cmp lib/sys/sh/rsudo/rsudo-mod-fs.lib.sh release/root/lib/sh/rsudo-mod-fs.lib.sh
          sh -n release/root/lib/sh/rsudo-mod-fs.lib.sh
          tar -tzf release/m-rsudo-v0.1.5-all.tar.gz >/dev/null
