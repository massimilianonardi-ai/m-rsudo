name: Verify rsudo Keycloak kcadm adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsudo-keycloak-kcadm.yml'
      - '.github/scripts/rsudo-keycloak-kcadm-test.sh'
      - 'lib/sys/sh/rsudo/rsudo-mod-keycloak.lib.sh'
      - 'res/sys/manual/rsudo-mod-keycloak.lib.sh'
      - 'build.sh'
  pull_request:
    paths:
      - '.github/workflows/rsudo-keycloak-kcadm.yml'
      - '.github/scripts/rsudo-keycloak-kcadm-test.sh'
      - 'lib/sys/sh/rsudo/rsudo-mod-keycloak.lib.sh'
      - 'res/sys/manual/rsudo-mod-keycloak.lib.sh'
      - 'build.sh'

permissions:
  contents: read

jobs:
  adapter-and-package:
    name: Keycloak kcadm adapter and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check POSIX shell syntax
        shell: sh
        run: |
          set -eu
          sh -n lib/sys/sh/rsudo/rsudo-mod-keycloak.lib.sh
          sh -n .github/scripts/rsudo-keycloak-kcadm-test.sh
          sh -n build.sh

      - name: Test kcadm forwarding without network or credentials
        shell: sh
        run: |
          set -eu
          sh .github/scripts/rsudo-keycloak-kcadm-test.sh

      - name: Verify distributable package includes the new adapter
        shell: sh
        run: |
          set -eu
          sh build.sh release
          cmp lib/sys/sh/rsudo/rsudo-mod-keycloak.lib.sh release/root/lib/sh/rsudo-mod-keycloak.lib.sh
          test ! -e release/root/lib/sh/rsudo-mod-keycloaklegacy.lib.sh
          test ! -e release/root/res/manual/rsudo-mod-keycloaklegacy.lib.sh
          test -f release/root/res/manual/rsudo-mod-keycloak.lib.sh
          tar -tzf release/m-rsudo-v0.1.3-all.tar.gz >/dev/null
